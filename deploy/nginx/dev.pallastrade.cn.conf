# PallasTrade dev.pallastrade.cn — authoritative reverse-proxy config (versioned in repo).
#
# 部署: 服务器 pull-deploy 在代码更新后由 deploy/nginx/sync-and-smoke.sh 原子同步到
#   /etc/nginx/sites-enabled/dev.pallastrade.cn 并 reload（nginx -t 失败自动回滚），
#   随后执行路由归属 smoke test。请勿再手工编辑服务器上的该文件（会与仓库漂移）。
#
# 路由所有权（根治 2026-09-06，禁止回退为 “/api/* → Rails” 一条通吃）:
#   /api/v3/*               → Rails (127.0.0.1:3102)  唯一对外 API namespace
#                            （rails routes 盘点：/api 下仅 /api/v3 前缀）
#   其余 /api/*             → storefront Next (127.0.0.1:3103)
#                              = storefront BFF route handlers:
#                              /api/checkout/*、/api/webhooks/pallastrade/*、
#                              以及未来任何新增的 Next /api 路由（默认即达，无需再加规则）
#   /admin /admin_user /assets /rails/active_storage → Rails（单独 location）
#   / (默认)                → storefront Next (127.0.0.1:3103)

server {
    listen 80;
    server_name dev.pallastrade.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.pallastrade.cn;

    ssl_certificate /etc/letsencrypt/live/pallastrade.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pallastrade.cn/privkey.pem;

    location /rails/active_storage/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
    }

    location /admin {
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin_user {
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 唯一对外 API namespace → Rails（nginx 最长前缀优先，/api/v3/ 恒命中本块）
    location /api/v3/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # storefront BFF（Next route handlers：/api/checkout/*、/api/webhooks/pallastrade/*…）→ Next
    location /api/ {
        proxy_pass http://127.0.0.1:3103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # 默认 → storefront
    location / {
        proxy_pass http://127.0.0.1:3103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
