# PallasTrade 生产栈 — pallastrade-prod（pallastrade.cn）
# 用法：cd deploy && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: pallastrade-prod

x-app: &app
  build:
    context: ../backend
    dockerfile: Dockerfile
    args:
      BUNDLE_MIRROR: ${BUNDLE_MIRROR:-}
      APT_MIRROR: ${APT_MIRROR:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    meilisearch:
      condition: service_healthy
    mailpit:
      condition: service_started
  env_file: .env.prod
  environment: &app-env
    DATABASE_URL: postgres://postgres@postgres:5432/pallastrade_production
    REDIS_URL: redis://redis:6379/0
    PORT: 3000
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    RAILS_FORCE_SSL: "true"
    RAILS_ASSUME_SSL: "true"
    RAILS_HOST: pallastrade.cn
    MEILISEARCH_URL: http://meilisearch:7700

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: curl -f http://localhost:7700/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: "500"

  web:
    <<: *app
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - storage_data:/rails/storage
    healthcheck:
      test: curl -f http://localhost:3000/up || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *app
    command: bundle exec sidekiq
    environment:
      <<: *app-env
      RAILS_MAX_THREADS: ${SIDEKIQ_DB_POOL:-27}
    volumes:
      - storage_data:/rails/storage

  storefront:
    build:
      context: ..
      dockerfile: storefront/Dockerfile
      args:
        PALLASTRADE_API_URL: https://pallastrade.cn
        PALLASTRADE_PUBLISHABLE_KEY: ${PALLASTRADE_PUBLISHABLE_KEY}
        APK_MIRROR: ${APK_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    env_file: .env.storefront.prod
    ports:
      - "127.0.0.1:3101:3001"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  storage_data:
