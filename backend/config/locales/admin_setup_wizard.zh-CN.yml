          done_subtitle: 记住，你随时可以继续添加！
          done_title: 做得不错，你已经给店铺添加了商品！
          import_hint: 你也可以从 CSV 或 Excel 文件批量导入商品。
        customer_support_email_task:
          copy: 我们需要你的客服邮箱以便在店铺前台展示。该邮箱将作为联系入口，方便客户就任何疑问或支持需求联系你。
          current_html: 你的客服邮箱是 %{email}。
          label: 客服邮箱
        payment_methods:
