# PALLAS-CUSTOM: 开店引导 / 前台接入 / 上架状态 / 概览的宿主 zh-CN 覆盖（2026-09-17，第四批 i18n）。
#
# 键集与 gem `pallastrade_admin/config/locales/en.yml` 的 admin.store_setup_tasks、
# admin.storefront_setup、admin.publishing、admin.dashboard 一一对应。
#
# 注意带 `_html` 后缀的键：值里有 `<a>` / `<strong>`，必须保留标签（含 data-turbo-frame），
# 因此这些值用 YAML 单引号包裹以避免引号冲突。

zh-CN:
  pallastrade:
    admin:
      store_setup_tasks:
        add_billing_address: 添加账单地址
        add_products: 添加商品
        add_products_task:
