# PALLAS-CUSTOM: 重复商品工作台的宿主 zh-CN 覆盖（2026-09-17，第四批 i18n）。
#
# 键集与 gem `pallastrade_admin/config/locales/en.yml` 的 admin.duplicate_products 一一对应。
# 该功能是本仓自建（D-2 批次），文案口径以 `Products::DuplicateCandidates` /
# `Products::MergePreview` 的实际语义为准：
#   - 「合并」只迁移变体/评论/图片/分类/促销，**历史订单永不改写**（history_note 即此含义）；
#   - `skipped_heading` 下的条目是**故意留在原处**的冲突项，不是失败。

