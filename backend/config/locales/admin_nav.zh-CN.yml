        disputes_capability_contract: 争议写契约
        disputes_capability_supported: 已支持
        disputes_capability_unsupported: 该提供方无争议写契约（UNSUPPORTED），写操作保持禁用。
        disputes_capability_evidence: 证据提交
        disputes_capability_accept: 接受争议
        disputes_capability_fee: 手续费采集
        disputes_capability_scope: 金额范围
