        disputes_accept_help: 接受争议等于向持卡人让步。该操作不可逆，通常意味着争议款项损失。
        disputes_accept_reason: 接受该争议的原因？
        disputes_accept_confirm: 确定接受该争议？不可撤销——争议款项将让步。
        disputes_accepted: 已接受争议（提供方状态 %{provider_status}）。
        disputes_accept_already_done: 该争议此前已用相同理由接受过（状态 %{provider_status}）。
        disputes_accept_needs_confirm: 接受争议需要显式确认。
        disputes_submissions: 最近的提供方操作
        disputes_evidence_failed: 操作未能完成。
        disputes_capability_title: 提供方能力与支付级风险敷口
        disputes_capability_help: 只读视图（不调提供方、不动资金）。写操作仍受权限 + 二次确认 + 审计约束。
        disputes_capability_no_payment: 无支付锚点，提供方能力不可判定。
