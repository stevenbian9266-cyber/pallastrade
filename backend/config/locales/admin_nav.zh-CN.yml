        disputes_danger_zone_help: 这两个动作会直接调用支付提供方，且无法在后台撤销。每次执行都经过权限校验、二次确认与审计；资金变动仍以提供方 webhook 为准。
        disputes_danger_unsupported: 当前网关不支持提交争议证据，请到提供方后台处理。
        disputes_danger_no_permission: 你没有提交证据或接受争议的权限。
