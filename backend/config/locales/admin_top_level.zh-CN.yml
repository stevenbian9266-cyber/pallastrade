# PALLAS-CUSTOM: 后台**顶级** `pallastrade.<key>` 文案的宿主 zh-CN 覆盖（2026-09-17，第三批）。
#
# 背景：量化（docs/research/RESEARCH-20260917-admin-i18n-gap.md）显示总缺 **1234** 键 ——
# 其中 `admin.*` 819 个、**其它 415 个**（含 271 个顶级叶子键）。此前几批只补了 `admin.*`。
#
# 本批是顶级叶子键里的**高频一批**：通用动作（add_*/cancel_*）、列表页标题
# （redirects/emails/blog/exports…）、调整项与退款说明、以及几个 help 文案。
#
# ⚠️ 注意 scope：这些键在 `zh-CN.pallastrade.<key>` 下（**没有** `admin.` 前缀）——
# 视图用 `PallasTrade.t(:in_stock)` 这类写法取它们。
#
# ⚠️ 有两条（`admin_language_help` / `admin_locale_help`）原文较长且被工具输出截断，
# 本批**跳过而非猜测**，留待下一批取完整原文后补。

