    # 这两个是本批**实际定位到**的缺失：商品列表页的库存列一直显示
    # "15000 in stock - 3 variants"（表格单元格，服务端渲染）。
    # 注：视图对它们调了 `.downcase`，中文不受影响。
    in_stock: 有货
    variants: 变体
    # —— 列表页 / 模块标题 ——
    redirects: 跳转
    emails: 邮件
    variant: 变体
    blog: 博客
    back_in_stock_subscriptions: 到货通知订阅
    abandoned_cart_notifications: 弃单提醒
    profile: 个人资料
    exports: 导出
    webhook_deliveries: Webhook 投递
    acceptance_errors: 受理错误
    # —— 通用「添加」动作 ——
    add_action_of_type: 添加动作类型
    add_coupon_code: 添加优惠码
    add_gift_card: 添加礼品卡
    add_new_address: 添加新地址
    add_one: 添加一个
    add_option_value: 添加选项值
    add_rule_of_type: 添加规则类型
    add_selected: 添加所选
    add_selected_products: 添加所选商品
    add_selected_variant: 添加所选变体
    add_variant: 添加变体
    added_at: 添加时间
    # —— 调整项 / 退款说明 ——
    adjustment_amount_help: 正数为加收，负数为抵扣。
    adjustment_closed_description: 该调整项已关闭，不会再被重算。
    adjustment_open_description: 该调整项处于开启状态，会被重算。
    all_items_have_been_returned: 所有商品均已退货
    all_time: 全部时间
    applied_to: 应用于
    calculated_reimbursements: 已计算的退款
    # —— 媒体 / 图片 ——
    alt_text: 替代文本
    assigned_variants: 关联的变体
    assigned_variants_help: 选择这张图片对应的变体。留空表示适用于全部变体。
    # —— 通用动作与状态 ——
    are_you_sure_delete: 确定要删除这条记录吗？
    authorization_failure: 授权失败
    automatic_promotion: 自动
    breadcrumbs: 面包屑
    cancel_order: 取消订单
    cannot_perform_operation: 无法执行该操作
    # —— 后台侧边栏 Symbol 型标签（2026-09-17，第四批）——
    #
    # `Navigation::Item#resolve_label` 对 Symbol 标签走 `PallasTrade.t(label)`，
    # 而 `PallasTrade.t` 只前置 `:pallastrade` → 真实键路径是**顶层** `pallastrade.<key>`。
    # 下面这 11 个曾经被写在 `pallastrade.admin.<key>`，于是中文**永远读不到**，
    # 中文后台里这些菜单项一直显示英文（走 humanize 兜底）。
    #
    # ⚠️ 其中 `imports` 尤其危险：`pallastrade.admin.imports` 在 en 侧是**功能域 Hash**
    # （导入向导的 16 条文案），而旧的中文里是**字符串**「导入」——两者同址，
    # 后加载的会覆盖先加载的。现已把中文移到顶层，两条线各自成立。
    imports: 导入
    tax_rates: 税率
    tax_categories: 税种
    shipping_methods: 配送方式
    shipping_categories: 配送类别
    return_authorization_reasons: 退货授权原因
    refund_reasons: 退款原因
    reimbursement_types: 退款类型
    stock_items: 库存项
    stock_movements: 库存变动
    stock_transfers: 库存调拨
    # —— 同一机制：**完全缺中文**的 Symbol 型标签（2026-09-17，第四批）——
    #
    # 下面这些在 zh 侧此前**没有任何**同路径文案（顶层与 admin.* 都没有），
    # 于是中文后台里它们同样走 humanize 兜底显示英文。实测渲染确认过：
    # `/admin` 的面包屑与页标题当时显示的就是 "Home"、侧栏显示 "Orders" / "Draft orders"。
    #
    # 取值一律对齐 gem / 宿主 en 侧同名键，避免自创措辞。
    allowed_origins: 允许的来源
    api_keys: API 密钥
    channels: 销售渠道
    customer_groups: 客户分组
    customers: 客户
    developers: 开发者
    draft_orders: 草稿订单
    gift_cards: 礼品卡
    home: 首页
    invitations: 邀请
    markets: 市场
    metafield_definitions: 元字段定义
    newsletter_subscribers: 订阅者
    options: 选项
    orders: 订单
    payments: 支付
    policies: 政策
    price_lists: 价格表
    products: 商品
    promotions: 促销
    reports: 报表
    return_authorizations: 退货授权
    returns: 退货
    roles: 角色
    shipping: 配送
    stock: 库存
    stock_locations: 库存点
    store_details: 店铺详情
    tax: 税费
    translations: 翻译
    users: 用户
    webhook_endpoints: Webhook 端点
    zones: 区域
    # —— 仪表盘指标卡与图表区间（2026-09-17，第四批；真渲染实测发现）——
    #
    # 实测 `/admin`：指标卡显示英文 Total Sales / Avg. Order Value / Total Orders / Sign-ups，
    # 图表上方另有 6 处 translation missing（date_range_presets）。
    #
    # ⚠️ date_range_presets 是**嵌套 Hash**，而它的缺失值曾被拼进 HTML 属性
    # （`title="translation missing: ...">Today</span>"`）——正是 skill 第二个坑。
    # 补齐后这一处属性撕裂同时消失。
    total_sales: 总销售额
    loading: 加载中…
    date_range_presets:
      today: 今天
      yesterday: 昨天
      last_7_days: 近 7 天
      last_30_days: 近 30 天
      this_month: 本月
      last_month: 上月
    # 这几条虽然带 admin. 前缀，但都是**直接挂在 admin 下的叶子键**（不是功能域），
    # 故与其它顶层键同处一个文件；与各 admin_<域>.zh-CN.yml 的 Hash 不冲突。
    admin:
      no_change: 无变化
      avg_order_value: 客单价
      total_orders: 订单数
      sign_ups: 注册数
      # 实测列表页出现 `translation missing: ...search_placeholder, resource: Product">
      # —— 又一次属性撕裂（skill 第二个坑），补齐即消失。
      search_placeholder: 搜索 %{resource}
      selected: 已选中
      next_page: 下一页
      export_only_filtered_records: 仅导出筛选结果（匹配搜索条件）
      export_all: 导出全部记录（数据量大时可能较慢）
    # —— 列表页与状态标签（2026-09-17，第四批；真渲染实测发现）——
    #
    # ⚠️ `import` / `export` 是**顶层**键（视图写 `PallasTrade.t(:import)`），
    # 不是 `admin.import` / `admin.export`（en 侧根本没有这两个键）。
    # 之前误放进 admin. 下会成为孤儿，列表页依旧显示英文。
    active: 已启用
    all: 全部
    import: 导入
    export: 导出
    filtered_records: 筛选结果
    # 发货状态：与 state_machine_states.shipped 同源，但发货单用自己这一组
    shipment_states:
      backorder: 缺货补货
      canceled: 已取消
      partial: 部分发货
      pending: 待处理
      ready: 就绪
      shipped: 已发货
    # —— 全站共享标签（2026-09-17，第四批；真渲染实测发现）——
    #
    # 这三组不是某个页面的专属文案，而是**跨页面复用**：
    #   actions            = 列表页/模态的通用动作（Save / Discard / Edit…）
    #   payment_states     = 订单列表的支付状态徽章
    #   state_machine_states = 订单/发货/退货的状态标签
