    customers_added_to_group:
      one: 已把 %{count} 位客户加入分组
      other: 已把 %{count} 位客户加入分组
    customers_removed_from_group:
      one: 已把 %{count} 位客户移出分组
      other: 已把 %{count} 位客户移出分组
    parent_order_returns_success:
