        invalid_cost: 成本必须是非负数
        invalid_quantity: 商品 %{item} 的数量必须是正整数
        invalid_status: 提供状态时必须是 'shipped'
        no_items_to_fulfill: 订单中没有待履约的商品
        order_canceled: 已取消的订单不能创建履约单
        order_not_completed: 只能在已完成的订单上手动创建履约单
