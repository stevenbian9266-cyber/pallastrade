# PALLAS-CUSTOM: 支付网关（Stripe）与线下支付的宿主 zh-CN 覆盖
# （2026-09-17，最终批）。
#
# 该 gem（`pallastrade_stripe`）只带 en，宿主需按
# `PallasTrade.t` 的 scope 规则（只前置 `:pallastrade`）在 **顶层** 覆盖。
#
# 口径提醒：
#   - Stripe 的 `requires_*` 是 **PaymentIntent 状态**（决定客户下一步要做什么），
#     不是错误码 —— 译成「需要…」而不是「…失败」；
zh-CN:
  pallastrade:
    stripe:
      payment_intent_errors:
        canceled: 支付意图已取消
        processing: 支付意图处理中
        requires_action: 支付意图需要额外验证
        requires_capture: 支付意图等待请款
        requires_confirmation: 支付意图等待确认
        requires_payment_method: 支付意图需要支付方式
        succeeded: 支付意图已成功
      payment_session_errors:
        zero_amount: 支付会话金额必须大于零
    bank_transfer: 银行转账
