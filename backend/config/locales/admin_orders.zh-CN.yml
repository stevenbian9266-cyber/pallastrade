# PALLAS-CUSTOM: 订单后台的宿主 zh-CN 覆盖（2026-09-17，最终批）。
#
# 键集与 gem `pallastrade_admin/config/locales/en.yml` 的 admin.orders 一一对应。
#
# 口径提醒：
#   - `avs_responses.*` / `cvv_responses.*` 是**收单机构返回码**的释义，
#     必须逐条直译其判定内容，不可归纳简化（商家要靠它判断是否追加验证）；
#   - `disputes_receipt_*` 三态（submitted/acknowledged/rejected）是**仅由服务商回写驱动**
#     的状态，措辞不能暗示系统会自行推断；
#   - `disputes_return_entry_help` 明确「处理争议不动库存与资金」，是安全承诺，不可弱化。

zh-CN:
  pallastrade:
    admin:
      orders:
        add_user_to_this_order: 把客户加入该订单
        avs_responses:
          a: 街道地址匹配，但 5 位与 9 位邮编均不匹配。
          b: 街道地址匹配，但邮编未验证。
          c: 街道地址与邮编均不匹配。
          d: 街道地址与邮编均匹配。
          e: AVS 数据无效，或该卡类型不允许使用 AVS。
          f: 持卡人姓名不匹配，但账单邮编匹配。
          g: 非美国发卡行不支持 AVS。
          h: 持卡人姓名不匹配，街道地址与邮编匹配。
          i: 地址未验证。
          j: 持卡人姓名、账单地址与邮编均匹配。
          k: 持卡人姓名匹配，但账单地址与账单邮编不匹配。
          l: 持卡人姓名与账单邮编匹配，但账单地址不匹配。
          m: 街道地址与邮编均匹配。
          n: 街道地址与邮编均不匹配。
          o: 持卡人姓名与账单地址匹配，但账单邮编不匹配。
          p: 邮编匹配，但街道地址未验证。
          q: 持卡人姓名、账单地址与邮编均匹配。
          r: 系统不可用。
          s: 银行不支持 AVS。
          t: 持卡人姓名不匹配，但街道地址匹配。
          u: 地址信息不可用。当美国银行不支持非美国 AVS，或该行的 AVS 功能异常时返回。
          v: 持卡人姓名、账单地址与账单邮编均匹配。
          w: 街道地址不匹配，但 9 位邮编匹配。
          x: 街道地址与 9 位邮编均匹配。
          y: 街道地址与 5 位邮编均匹配。
          z: 街道地址不匹配，但 5 位邮编匹配。
