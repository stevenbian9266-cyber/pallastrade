# PALLAS-CUSTOM: 商品侧栏/翻译/分类规则/选项/评论的宿主 zh-CN 覆盖
# （2026-09-17，第四批 i18n）。
#
# 键集与 gem `pallastrade_admin/config/locales/en.yml` 的 admin.product_history、
# admin.product_translations、admin.translations、admin.taxon_rules、admin.taxon_types、
# admin.option_types、admin.reviews 一一对应。
#
# 口径提醒：
#   - product_history.kinds.* 是**动作类型**（不是状态）：bulk_* 来自批量操作，
#     对应 `ProductHistory::Recorder` 写入的 metadata.source = 'bulk'；
#   - reviews.bulk.result 的四个计数分别代表「已更新 / 无权限跳过 / 状态不允许跳过 / 未找到」，
#     与 `ReviewsController#bulk` 的报告字段一一对应，不能合并措辞。

