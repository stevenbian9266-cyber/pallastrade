# PALLAS-CUSTOM: 后台/前台通用**顶层**词表 —— 第 1 部分（2026-09-17，最终批）。
#
# 来源：gem `pallastrade_admin` / `pallastrade_core` / `pallastrade_api` 的 en 侧
# 同名键。这些是**不带 `admin.` 前缀**的 `pallastrade.<key>` 叶子键，
# 视图多写作 `PallasTrade.t(:some_key)`。
#
# 命名说明：这部分与第 2 部分同属一个巨大词表（868 键），按字母序对半拆分
# 只为控制单文件规模；键路径都是 `zh-CN.pallastrade.<key>`，与其它文件天然合并。
#
# ⚠️ YAML 细节（本仓踩过的坑）：
#   - `at_symbol: @` 的 `@` 是 YAML 保留起始字符 → 必须加引号；
#   - `required: '*'` 的 `*` 是别名指示符 → 必须加引号；
#   - 以 `%{` 开头的插值串必须加引号。

