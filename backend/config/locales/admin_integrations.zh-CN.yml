# PALLAS-CUSTOM: 集成面（Webhook / API 密钥）的宿主 zh-CN 覆盖（2026-09-17，第四批 i18n）。
#
# 键集与 gem `pallastrade_admin/config/locales/en.yml` 的 admin.webhook_endpoints、
# admin.webhook_deliveries、admin.api_keys、admin.oauth_applications、
# admin.webhooks_subscribers 一一对应。
#
# 口径提醒：`publishable` 与 `secret` 是 API 密钥的**类型**（pk_/sk_），
# 与「公开渠道」无关；这里统一译作「可公开 / 机密」，
# 与 `admin_payment_methods.zh-CN.yml` 对凭据分级（publishable/secret/internal）的用词一致。

