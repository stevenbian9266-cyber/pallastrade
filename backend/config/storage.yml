test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

amazon:
  service: S3
  access_key_id: <%= ENV.fetch("AWS_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("AWS_SECRET_ACCESS_KEY", "") %>
  region: <%= ENV.fetch("AWS_REGION", "") %>
  bucket: <%= ENV.fetch("AWS_BUCKET", "pallastrade-#{Rails.env}") %>

cloudflare:
  service: S3
  endpoint: <%= ENV.fetch("CLOUDFLARE_ENDPOINT", "") %>
  access_key_id: <%= ENV.fetch("CLOUDFLARE_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("CLOUDFLARE_SECRET_ACCESS_KEY", "") %>
  region: auto
  bucket: <%= ENV.fetch("CLOUDFLARE_BUCKET", "pallastrade-#{Rails.env}") %>
  force_path_style: true
  request_checksum_calculation: "when_required"
  response_checksum_validation: "when_required"

# Aliyun OSS (S3-compatible). Uses virtual-hosted-style access (force_path_style
# must stay false — Aliyun rejects path-style for bucket-level APIs).
# `public: true` makes ActiveStorage upload with ACL=public-read and generate
# unsigned public URLs — required because Aliyun OSS rejects presigned GETs that
# override `response-content-type` (returns InvalidRequest).
aliyun:
  service: S3
  endpoint: <%= ENV.fetch("OSS_ENDPOINT", "") %>
  access_key_id: <%= ENV.fetch("OSS_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("OSS_SECRET_ACCESS_KEY", "") %>
  region: <%= ENV.fetch("OSS_REGION", "oss-cn-hangzhou") %>
  bucket: <%= ENV.fetch("OSS_BUCKET", "pallastrade-#{Rails.env}") %>
  public: true
  request_checksum_calculation: "when_required"
  response_checksum_validation: "when_required"
