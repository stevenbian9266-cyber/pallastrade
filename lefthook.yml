# Root-level harness gates — agent-agnostic physical enforcement.
# Install once:  npm i && npx lefthook install
# (or: pnpm i && pnpm exec lefthook install)
#
# pre-commit: block error-severity anti-patterns in staged files (warnings are
#   reported but do not block — they stay advisory).
# pre-push:   doc-impact requires knowledge docs to be synced with code.
#
# These hooks are the ONLY enforcement point that works regardless of which
# AI agent (Copilot / Codex / Claude Code) or human drives the repo.

pre-commit:
  commands:
    harness-gate:
      run: npx harness gate:required
    harness-anti-patterns:
      glob: "**/*.{rb,ts,tsx,js,jsx,css}"
      exclude: "**/node_modules/**|**/dist/**|**/.next/**|**/vendor/**|**/build/**"
      run: npx harness scan-anti-patterns --files {staged_files}
    harness-degraded-loop:
      glob: "**/*.{ts,tsx,js,jsx}"
      exclude: "**/node_modules/**|**/dist/**|**/.next/**|**/build/**"
      run: npx harness scan-degraded-loop --files {staged_files}
    harness-secrets:
      glob: "**/*.{rb,ts,tsx,js,jsx,yml,yaml,env,sh}"
      exclude: "**/node_modules/**|**/dist/**|**/.next/**|**/vendor/**|**/build/**|**/coverage/**"
      run: npx harness scan-secrets --files {staged_files}
    harness-nav-validate:
      glob: "**/pallastrade_admin_navigation.rb"
      run: node scripts/nav-validate-static.mjs
    harness-prd-status:
      glob: "docs/prd/**/*.md"
      run: node scripts/ci/prd-status-sync.mjs --check
    # 本地环境守卫（advisory，不阻断提交）：Docker Desktop 上 `docker exec` 会「有输出但不退出」，
    # 这时跑 harness verify / rspec 会静默挂死数分钟。这里提前报警并给出一条命令的修法。
    docker-health:
      glob: "{harness.config.mjs,lefthook.yml,package.json,scripts/**,deploy/**,backend/docker-compose*.yml}"
      run: node scripts/ops/docker-health.mjs --warn-only

pre-push:
  commands:
    harness-doc-impact:
      run: npx harness doc-impact --base origin/dev
