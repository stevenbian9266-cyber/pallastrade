name: Harness Full
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harness-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Anti-Pattern Scan (always runs, fast) ----
  anti-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Run anti-pattern scan
        run: node scripts/harness/scan-anti-patterns.mjs scan

  # ---- Doc Impact Check (always runs, fast) ----
  doc-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check knowledge doc sync
        run: node scripts/harness/cli.mjs doc-impact --base origin/main

  # ---- AI Freshness Check (runs when ai/ changes) ----
  ai-freshness:
    if: contains(github.event.pull_request.changed_files, 'ai/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check skill freshness
        run: node scripts/harness/cli.mjs eval-ai --check-freshness

  # ---- Generated Drift Check ----
  generated-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.1 }
      - name: Run generated:check
        run: node scripts/harness/cli.mjs generated:check

  # ---- Backend Tests (RSpec + Brakeman + bundle-audit) ----
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pallastrade
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [5432:5432]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler-cache: true
          working-directory: backend

      - name: Setup Database
        run: |
          cd backend
          cp .env.example .env 2>/dev/null || touch .env
          bundle exec rails db:create db:migrate

      - name: Run RSpec (root app + gem specs)
        run: |
          cd backend
          bundle exec rspec spec/ pallastrade_gems/pallastrade_*/spec/ \
            --format progress \
            --format RspecJunitFormatter --out rspec-junit.xml

      - name: Run Brakeman
        run: |
          cd backend
          bundle exec brakeman -q --no-summary

      - name: Run bundle-audit
        run: |
          cd backend
          bundle exec bundle-audit check --update

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspec-junit
          path: backend/rspec-junit.xml

  # ---- Storefront Tests ----
  test-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.1 }
      - name: Install & Test
        run: |
          cd storefront
          pnpm install --frozen-lockfile
          pnpm check
          pnpm typecheck
          pnpm test

  # ---- Platform Tests ----
  test-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.1 }
      - name: Install & Test
        run: |
          cd platform
          pnpm install --frozen-lockfile
          pnpm turbo lint typecheck test build --cache-dir=.turbo
