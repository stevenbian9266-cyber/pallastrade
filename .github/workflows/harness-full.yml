name: Harness Full
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: harness-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Anti-Pattern Scan (always runs, fast) ----
  anti-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install root deps
        run: npm ci
      - name: Run anti-pattern scan
        run: npx harness scan-anti-patterns

  # ---- Secret / Destructive Code Scan (always runs, fast) ----
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install root deps
        run: npm ci
      - name: Run secret & destructive-code scan
        run: npx harness scan-secrets

  # ---- Doc Impact Check (always runs, fast) ----
  doc-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install root deps
        run: npm ci
      - name: Check knowledge doc sync
        run: npx harness doc-impact --base origin/main

  # ---- AI Freshness Check (runs when ai/ changes) ----
  ai-freshness:
    if: contains(github.event.pull_request.changed_files, 'ai/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install root deps
        run: npm ci
      - name: Check skill freshness
        run: npx harness eval-ai --check-freshness

  # ---- Generated Drift Check ----
  generated-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.1 }
      - name: Install root deps
        run: npm ci
      - name: Run generated:check
        run: npx harness generated:check

  # ---- Backend Tests (RSpec + Brakeman + bundle-audit) ----
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_USERNAME: postgres
      DATABASE_PORT: "5432"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [5432:5432]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler-cache: true
          working-directory: backend

      - name: Setup Database
        run: |
          cd backend
          cp .env.example .env 2>/dev/null || touch .env
          bundle exec rails db:create db:migrate

      - name: Run RSpec (root app + gem specs)
        run: |
          cd backend
          bundle exec rspec spec/ pallastrade_gems/pallastrade_*/spec/ --format progress

      - name: Run Brakeman
        run: |
          cd backend
          bundle exec brakeman -q --no-summary

      - name: Run bundle-audit
        run: |
          cd backend
          bundle exec bundle-audit check --update

  # ---- Storefront Tests ----
  test-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.1 }
      - name: Install & Test
        run: |
          cd storefront
          pnpm install --frozen-lockfile
          pnpm check
          pnpm typecheck
          pnpm test

  # ---- Platform Tests ----
  test-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.1 }
      - name: Install & Test
        run: |
          cd platform
          pnpm install --frozen-lockfile
          pnpm turbo lint typecheck test build --cache-dir=.turbo

  # ---- Coverage Gate (storefront vitest coverage vs threshold) ----
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.1 }
      - name: Install root deps
        run: npm ci
      - name: Generate storefront coverage
        run: |
          cd storefront
          pnpm install --frozen-lockfile
          pnpm test:coverage
      - name: Enforce coverage threshold
        run: npx harness coverage --component storefront --enforce

  # ---- Harness Evidence Artifact (always runs, fast) ----
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Collect harness evidence
        run: npx harness evidence
      - uses: actions/upload-artifact@v4
        with:
          name: harness-evidence
          path: artifacts/harness-evidence/
          if-no-files-found: error
