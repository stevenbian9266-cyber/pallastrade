name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 拉取式部署（方案 A）：CI 不再跨境 SSH 到阿里云服务器（TCP 22 被 GFW 阻断）。
      # CI 只负责构建 + 推送镜像到 ghcr.io；服务器 cron 每 5 分钟运行
      # deploy/pull-deploy.sh 主动拉取代码 + 镜像，检测到变化才部署。

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the storefront image on the runner — the 2C/3.5G server OOMs running
      # `next build`, so we build here and push to ghcr.io for the server to pull.
      - name: Build storefront image (runner)
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://dev.pallastrade.cn"
          PUB_KEY="${{ secrets.PALLASTRADE_PUBLISHABLE_KEY_DEV }}"
          STORE_NAME="${{ vars.STORE_NAME_DEV || 'PallasTrade-Dev' }}"
          SITE_URL="https://dev.pallastrade.cn"
          DEFAULT_LOCALE="${{ vars.DEFAULT_LOCALE_DEV || 'en' }}"
          DEFAULT_COUNTRY="${{ vars.DEFAULT_COUNTRY_DEV || 'US' }}"
          # PALLAS-CUSTOM bugfix (2026-09-11): NEXT_PUBLIC_* 在 next build 时被内联
          # （客户端+服务端都生效），必须与 deploy/.env.storefront.dev 的运行时值一致
          # （见 storefront/Dockerfile 注释，不一致会触发 hydration mismatch）。
          # 此前漏传 SITE_URL/DEFAULT_*/STORE_NAME → 密码重置邮件 handler 500、
          # 邮件链接全坏（webhook 事务邮件链路）。
          docker build -t ghcr.io/${{ github.repository_owner }}/pallastrade-storefront:${{ github.ref_name }} \
            -f storefront/Dockerfile \
            --build-arg PALLASTRADE_API_URL="$API_URL" \
            --build-arg PALLASTRADE_PUBLISHABLE_KEY="$PUB_KEY" \
            --build-arg NEXT_PUBLIC_STORE_NAME="$STORE_NAME" \
            --build-arg NEXT_PUBLIC_SITE_URL="$SITE_URL" \
            --build-arg NEXT_PUBLIC_DEFAULT_LOCALE="$DEFAULT_LOCALE" \
            --build-arg NEXT_PUBLIC_DEFAULT_COUNTRY="$DEFAULT_COUNTRY" \
            --build-arg NEXT_PUBLIC_TAWK_TO_PROPERTY_ID="${{ vars.TAWK_TO_PROPERTY_ID }}" \
            --build-arg NEXT_PUBLIC_TAWK_TO_WIDGET_ID="${{ vars.TAWK_TO_WIDGET_ID }}" \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ vars.TURNSTILE_SITE_KEY }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ vars.STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg NPM_REGISTRY=https://registry.npmmirror.com \
            --build-arg APK_MIRROR=mirrors.aliyun.com \
            .

      - name: Push storefront image to ghcr.io
        shell: bash
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/pallastrade-storefront:${{ github.ref_name }}
          echo "✅ 镜像已推送，服务器 pull-deploy.sh 将在 5 分钟内自动部署"
