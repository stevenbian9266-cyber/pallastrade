name: Harness Upgrade
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      from_version:
        description: 'Upgrade from version'
        required: true
        default: '5.5'
      to_version:
        description: 'Upgrade to version'
        required: true
        default: '5.6'

concurrency:
  group: harness-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Upgrade Audit ----
  upgrade-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Run upgrade audit
        run: |
          node scripts/harness/cli.mjs upgrade:audit \
            --from ${{ github.event.inputs.from_version || '5.5' }} \
            --to ${{ github.event.inputs.to_version || '5.6' }} \
            --format json > artifacts/upgrade-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-audit
          path: artifacts/upgrade-audit.json

  # ---- Customization Conflict Detection ----
  conflict-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check for framework overwrites of customer files
        run: |
          echo "Checking customization conflicts..."
          if [ -f .pallastrade-customization ]; then
            echo "✅ Customization manifest found."
          else
            echo "⚠️  No .pallastrade-customization file. Cannot detect conflicts."
          fi
          # In a real upgrade, compare framework-managed paths against customer paths

  # ---- Evidence Generation ----
  generate-evidence:
    needs: [upgrade-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Generate evidence package
        run: node scripts/harness/cli.mjs upgrade:evidence
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-evidence
          path: artifacts/upgrade-evidence/
