name: AI CI

on:
  workflow_call:
  push:
    branches: [main, dev]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ai/scripts/ci/plugin-structure-check.mjs
