name: Storefront CI

on:
  workflow_call:
  push:
    branches: [main, dev]
    paths:
      - 'storefront/**'
      - '.github/workflows/storefront-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'storefront/**'
      - '.github/workflows/storefront-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: storefront/pnpm-lock.yaml
      - name: Install SDK build dependencies
        working-directory: platform
        run: pnpm install --frozen-lockfile
      - name: Build Storefront SDK dependencies
        working-directory: platform
        run: |
          pnpm --filter @pallastrade/sdk-core build
          pnpm --filter @pallastrade/sdk build
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npx tsc --noEmit
      - run: pnpm test
