name: Nightly Full Test

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # 被调用的 backend-ci.yml 在 workflow 级声明 packages: write（构建并推送镜像）
  # GitHub 规则：被调用 workflow 的权限不得高于调用方，否则整个 run 直接 startup_failure（无日志）。
  # 2026-09-12 修复：此前只声明 contents: read，导致 Nightly 自 2026-09-08 起每晚 startup_failure。
  packages: write

jobs:
  backend:
    name: Backend full suite
    uses: ./.github/workflows/backend-ci.yml

  storefront:
    name: Storefront suite
    uses: ./.github/workflows/storefront-ci.yml

  platform:
    name: Platform suite
    uses: ./.github/workflows/platform-ci.yml

  harness:
    name: Harness full check + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Install root deps (ignore native scripts)
        run: pnpm install --ignore-scripts
      - name: Install + build SDK deps
        working-directory: platform
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pallastrade/sdk-core build
          pnpm --filter @pallastrade/sdk build
      - name: Storefront coverage
        working-directory: storefront
        run: pnpm test:coverage
      - name: Platform coverage (sdk)
        working-directory: platform
        run: pnpm --filter @pallastrade/sdk test:coverage
      - name: Harness full checks
        run: npx harness check --profile full
      - name: Coverage gate — storefront
        run: npx harness coverage --component storefront --enforce
      - name: Coverage gate — platform
        run: npx harness coverage --component platform --enforce
      - name: Freshness + scenarios
        run: |
          npx harness eval-ai --check-freshness
          npx harness eval-ai --scenarios
