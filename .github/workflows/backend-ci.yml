name: Backend CI

on:
  workflow_call:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/pallastrade_test
      REDIS_URL: redis://localhost:6379/0
      RAILS_ENV: test
      # 覆盖率阈值由 harness-full.yml 的独立 coverage job 管；此处跳过内嵌 SimpleCov 检查（见 spec/rails_helper.rb）
      DISABLE_SIMPLECOV_MINIMUM: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose environment contract
        shell: pwsh
        run: ./scripts/ci/compose-config-check.ps1
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - name: Prepare database
        run: bin/rails db:prepare
      - name: Precompile assets
        run: bin/rake assets:precompile
      - name: Run tests
        run: bundle exec rspec
      - name: Brakeman security scan
        run: bundle exec brakeman --no-pager -q
      - name: Bundle audit
        run: bundle exec bundle-audit check --update

  build-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    # 仅在 push dev/main 或手动触发时构建镜像，PR 不构建（节省 CI 时间）
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pallastrade-web:latest
            ghcr.io/${{ github.repository_owner }}/pallastrade-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
