<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="90" height="32" viewBox="0 0 90 32"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="title desc">
  <title id="title">PallasTrade</title>
  <desc id="desc">PallasTrade logo using the supplied Pallas's cat illustration.</desc>

  <image x="1" y="4" width="24" height="24"
         preserveAspectRatio="xMidYMid meet"
         href="data:image/png;base64,"
         xlink:href="data:image/png;base64,"/>

  <text x="27" y="19.7"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10.7"
        font-weight="700"
        letter-spacing="-0.35"
        dominant-baseline="middle">
    <tspan fill="#0A2540">Pallas</tspan><tspan fill="#0F9D94">Trade</tspan>
  </text>
</svg>
